name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  ROGUE_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Build metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_label: ${{ steps.version.outputs.build_label }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read and validate application version
        id: version
        shell: bash
        run: |
          cmake \
            -DROGUE_VERSION_OUTPUT="$RUNNER_TEMP/version.txt" \
            -DROGUE_BUILD_LABEL_OUTPUT="$RUNNER_TEMP/build-label.txt" \
            -DROGUE_RELEASE_TAG="$ROGUE_RELEASE_TAG" \
            -P cmake/WriteVersion.cmake
          version="$(tr -d '\r\n' < "$RUNNER_TEMP/version.txt")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid CMake application version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_label=$(tr -d '\r\n' < "$RUNNER_TEMP/build-label.txt")" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows x64 package
    needs: metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc
      - name: Configure
        run: cmake --preset release-windows-x64 --fresh -G Ninja "-DROGUE_RELEASE_TAG=$env:ROGUE_RELEASE_TAG"
      - name: Build
        run: cmake --build --preset release-windows-x64 --parallel
      - name: Test
        run: ctest --preset release-windows-x64 --output-on-failure
      - name: Verify installed application
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "rogue-install"
          cmake --install build/release-windows-x64 --prefix $stage --component RogueAssistant
          if ($LASTEXITCODE -ne 0) {
            throw "cmake --install failed"
          }
          cmake `
            "-DROGUE_INSTALL_ROOT=$stage" `
            "-DROGUE_INSTALL_PLATFORM=windows" `
            "-DROGUE_EXPECTED_VERSION=${{ needs.metadata.outputs.version }}" `
            -P cmake/VerifyInstall.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "Installed application verification failed"
          }
          $dependencies = & dumpbin /DEPENDENTS "$stage/bin/RogueAssistant.exe" | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed while inspecting the packaged executable"
          }
          if ($dependencies -match '(?i)\b(?:vcruntime|msvcp|ucrtbased?)\d*\.dll\b') {
            throw "Windows package unexpectedly depends on the dynamic MSVC runtime`n$dependencies"
          }
      - name: Package ZIP
        run: cpack --preset release-windows-x64
      - name: Check package name
        shell: pwsh
        run: |
          $package = "build/release-windows-x64/packages/RogueAssistant-${{ needs.metadata.outputs.build_label }}-windows-x64.zip"
          if (-not (Test-Path $package -PathType Leaf)) {
            throw "Expected package was not created: $package"
          }
          $extract = Join-Path $env:RUNNER_TEMP "rogue-package"
          if (Test-Path $extract) {
            Remove-Item -Recurse -Force $extract
          }
          Expand-Archive -LiteralPath $package -DestinationPath $extract
          cmake `
            "-DROGUE_INSTALL_ROOT=$extract" `
            "-DROGUE_INSTALL_PLATFORM=windows" `
            "-DROGUE_EXPECTED_VERSION=${{ needs.metadata.outputs.version }}" `
            -P cmake/VerifyInstall.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged application verification failed"
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          if-no-files-found: error
          path: build/release-windows-x64/packages/RogueAssistant-${{ needs.metadata.outputs.build_label }}-windows-x64.zip

  macos:
    name: macOS arm64 package
    needs: metadata
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select C++20-capable Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Configure
        run: cmake --preset release-macos-arm64 --fresh -G Ninja -DROGUE_RELEASE_TAG="$ROGUE_RELEASE_TAG"
      - name: Build
        run: cmake --build --preset release-macos-arm64 --parallel
      - name: Test
        run: ctest --preset release-macos-arm64 --output-on-failure
      - name: Verify installed application
        run: |
          stage="$RUNNER_TEMP/rogue-install"
          cmake --install build/release-macos-arm64 \
            --prefix "$stage" \
            --component RogueAssistant \
            --strip
          cmake \
            -DROGUE_INSTALL_ROOT="$stage" \
            -DROGUE_INSTALL_PLATFORM=macos \
            -DROGUE_EXPECTED_VERSION=${{ needs.metadata.outputs.version }} \
            -P cmake/VerifyInstall.cmake
          test "$(lipo -archs "$stage/RogueAssistant.app/Contents/MacOS/RogueAssistant")" = arm64
      - name: Validate Apple credential set
        shell: bash
        run: |
          cert_count=0
          for value in "$MACOS_CERTIFICATE_P12" "$MACOS_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY"; do
            [[ -n "$value" ]] && cert_count=$((cert_count + 1))
          done
          if [[ $cert_count -ne 0 && $cert_count -ne 3 ]]; then
            echo "The three macOS signing secrets must be supplied together" >&2
            exit 1
          fi
          notary_count=0
          for value in "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD"; do
            [[ -n "$value" ]] && notary_count=$((notary_count + 1))
          done
          if [[ $notary_count -ne 0 && $notary_count -ne 3 ]]; then
            echo "The three Apple notarization secrets must be supplied together" >&2
            exit 1
          fi
          if [[ $notary_count -eq 3 && $cert_count -ne 3 ]]; then
            echo "Notarization requires the complete signing credential set" >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        shell: bash
        env:
          KEYCHAIN_PASSWORD: rogue-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/rogue-release.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          cmake -E rm -f "$certificate"
      - name: Package, sign, and conditionally notarize
        run: >-
          bash packaging/macos/package.sh
          build/release-macos-arm64
          dist
      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          if-no-files-found: error
          path: dist/RogueAssistant-${{ needs.metadata.outputs.build_label }}-macos-arm64.dmg
      - name: Remove temporary keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security delete-keychain "$RUNNER_TEMP/rogue-release.keychain-db" || true

  linux:
    name: Linux x86_64 packages
    needs: metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libfreetype6-dev libfuse2 libgl1-mesa-dev libudev-dev libx11-dev
          libxcursor-dev libxext-dev libxi-dev libxrandr-dev
      - name: Configure
        run: cmake --preset release-linux-x86_64 --fresh -G Ninja -DROGUE_RELEASE_TAG="$ROGUE_RELEASE_TAG"
      - name: Build
        run: cmake --build --preset release-linux-x86_64 --parallel
      - name: Test
        run: ctest --preset release-linux-x86_64 --output-on-failure
      - name: Verify installed application
        run: |
          stage="$RUNNER_TEMP/rogue-install"
          cmake --install build/release-linux-x86_64 \
            --prefix "$stage" \
            --component RogueAssistant \
            --strip
          cmake \
            -DROGUE_INSTALL_ROOT="$stage" \
            -DROGUE_INSTALL_PLATFORM=linux \
            -DROGUE_EXPECTED_VERSION=${{ needs.metadata.outputs.version }} \
            -P cmake/VerifyInstall.cmake
      - name: Package tar archive
        run: cpack --preset release-linux-x86_64
      - name: Download checksum-pinned linuxdeploy
        run: |
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
      - name: Package AppImage
        run: >-
          bash packaging/linux/build-appimage.sh
          build/release-linux-x86_64
          dist
          "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
      - name: Check and stage package files
        run: |
          archive="build/release-linux-x86_64/packages/RogueAssistant-${{ needs.metadata.outputs.build_label }}-linux-x86_64.tar.gz"
          test -f "$archive"
          test -x "dist/RogueAssistant-${{ needs.metadata.outputs.build_label }}-linux-x86_64.AppImage"
          extract="$RUNNER_TEMP/rogue-package"
          cmake -E rm -rf "$extract"
          cmake -E make_directory "$extract"
          tar -xzf "$archive" -C "$extract"
          cmake \
            -DROGUE_INSTALL_ROOT="$extract" \
            -DROGUE_INSTALL_PLATFORM=linux \
            -DROGUE_EXPECTED_VERSION=${{ needs.metadata.outputs.version }} \
            -P cmake/VerifyInstall.cmake
          cp "$archive" "dist/RogueAssistant-${{ needs.metadata.outputs.build_label }}-linux-x86_64.tar.gz"
      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            dist/RogueAssistant-${{ needs.metadata.outputs.build_label }}-linux-x86_64.tar.gz
            dist/RogueAssistant-${{ needs.metadata.outputs.build_label }}-linux-x86_64.AppImage

  assemble:
    name: Checksums
    needs:
      - metadata
      - windows
      - macos
      - linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: dist
      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: dist
      - name: Download macOS installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: dist
      - name: Verify inventory and write checksums
        shell: bash
        run: |
          build_label="${{ needs.metadata.outputs.build_label }}"
          artifacts=(
            "RogueAssistant-$build_label-windows-x64.zip"
            "RogueAssistant-$build_label-macos-arm64.dmg"
            "RogueAssistant-$build_label-linux-x86_64.AppImage"
            "RogueAssistant-$build_label-linux-x86_64.tar.gz"
          )
          for artifact in "${artifacts[@]}"; do
            if [[ ! -s "dist/$artifact" ]]; then
              echo "Missing or empty release artifact: dist/$artifact" >&2
              find dist -type f -print >&2
              exit 1
            fi
          done
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          (
            cd dist
            sha256sum "${artifacts[@]}" THIRD_PARTY_NOTICES.md > SHA256SUMS
          )
      - name: Upload complete release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RogueAssistant-${{ needs.metadata.outputs.build_label }}-packages
          if-no-files-found: error
          path: dist/*
      - name: Create or update draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq 'if .isDraft then "draft" else "published" end')"; then
            if [[ "$release_state" != draft ]]; then
              echo "Refusing to replace files in a published release" >&2
              exit 1
            fi
          else
            release_options=(
              --draft
              --verify-tag
              --title "Emerald Rogue Assistant ${{ needs.metadata.outputs.version }}"
              --generate-notes
            )
            if [[ "${{ needs.metadata.outputs.prerelease }}" == true ]]; then
              release_options+=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_options[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
